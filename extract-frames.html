<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sayed Golf - Frame Extractor</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #333;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="status">جاري تهيئة المحرك وتحميل المجسم...</div>
  <script type="module" src="/scripts/extractor.js"></script>
</body>
</html>
